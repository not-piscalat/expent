<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C0940"/>
      <stop offset="55%" stop-color="#2A1060"/>
      <stop offset="100%" stop-color="#160830"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="62%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg1)" clip-path="url(#rounded)"/>
  <rect width="512" height="512" fill="url(#bgGlow)" clip-path="url(#rounded)"/>
  <!-- Top edge highlight -->
  <rect x="0" y="0" width="512" height="1" fill="rgba(196,181,253,0.18)" clip-path="url(#rounded)"/>

  <!-- Icon scaled 8x (64→512) -->
  <g transform="scale(8)">
    <line x1="5" y1="39" x2="59" y2="39" stroke="rgba(139,92,246,0.12)" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="5" y1="24" x2="59" y2="24" stroke="rgba(139,92,246,0.12)" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="5" y1="10" x2="59" y2="10" stroke="rgba(139,92,246,0.12)" stroke-width="1" stroke-dasharray="2 3"/>

    <rect x="7" y="36" width="12" height="18" rx="4" fill="url(#g1)"/>
    <rect x="26" y="24" width="12" height="30" rx="4" fill="url(#g2)"/>
    <rect x="45" y="10" width="12" height="44" rx="4" fill="url(#g3)" filter="url(#glow)"/>

    <rect x="9" y="38" width="8" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="28" y="26" width="8" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="47" y="12" width="8" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>

    <polyline points="13,36 32,24 51,10" stroke="rgba(196,181,253,0.3)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="2 3"/>

    <line x1="6" y1="54" x2="58" y2="54" stroke="rgba(109,40,217,0.35)" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="51" cy="10" r="3.5" fill="#EDE9FE" filter="url(#dotGlow)"/>
    <circle cx="51" cy="10" r="5.5" stroke="rgba(221,214,254,0.3)" stroke-width="1" fill="none"/>
  </g>
</svg>