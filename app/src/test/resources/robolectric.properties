# Unit tests run against a minimal manifest (TestManifest.xml) instead of the
# app manifest: the app's Firebase/Crashlytics content providers must not
# auto-initialize here, because they spawn non-daemon background threads
# (datatransport scheduler, Room disk executors) that survive sandbox teardown
# and crash the Gradle test worker at JVM shutdown ("Process 'Gradle Test
# Executor' finished with non-zero exit value 1" / connection reset).
manifest=TestManifest.xml
